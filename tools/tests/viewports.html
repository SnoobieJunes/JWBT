<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>viewport harness</title>
<style>
body{margin:0;background:#333;font:12px system-ui;color:#fff}
.row{display:flex;gap:8px;align-items:flex-start;padding:8px}
figure{margin:0}
figcaption{padding:4px 0}
iframe{border:1px solid #888;background:#fff;height:1400px}
</style></head><body>
<div class="row">
  <figure><figcaption>320 &times; iPhone SE</figcaption><iframe src="../../index.html" width="320" title="320"></iframe></figure>
  <figure><figcaption>360 &times; cheap Android</figcaption><iframe src="../../index.html" width="360" title="360"></iframe></figure>
  <figure><figcaption>412 &times; Pixel</figcaption><iframe src="../../index.html" width="412" title="412"></iframe></figure>
</div>
<script>
window.check = function () {
  return [...document.querySelectorAll('iframe')].map(f => {
    const d = f.contentDocument.documentElement;
    const off = [...f.contentDocument.querySelectorAll('*')]
      .filter(e => e.getBoundingClientRect().right > d.clientWidth + 1)
      .map(e => e.tagName + '.' + (e.className || '') + ' right=' + Math.round(e.getBoundingClientRect().right));
    return { w: f.width, viewport: d.clientWidth, scrollWidth: d.scrollWidth,
             overflow: d.scrollWidth > d.clientWidth, offenders: off.slice(0, 8) };
  });
};
</script>
</body></html>
